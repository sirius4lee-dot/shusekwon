                }

                alert("비밀번호가 틀렸습니다.");
                document.getElementById('password-input').value = "";

        }

        function getColorByRating(ratingStr) {
            let percent = parseFloat(ratingStr.replace('%', ''));
    
            // 5% 이하 고정 (빨간색)
            if (percent <= 5) return "#ff4d4d";
            // 50% 이상 고정 (연두색)
            if (percent >= 50) return "#7acc29";
    
            // 5% ~ 50% 사이를 0(빨강)부터 1(연두)까지의 비율로 계산
            let minPercent = 5;
            let maxPercent = 50;
            let ratio = (percent - minPercent) / (maxPercent - minPercent);
    
            // 시작 색상: 빨강 (#ff4d4d -> R: 255, G: 77, B: 77)
            let r1 = 255, g1 = 77, b1 = 77;
            // 끝 색상: 연두 (#7acc29 -> R: 122, G: 204, B: 41)
            let r2 = 122, g2 = 204, b2 = 41;
    
            // 비율에 맞춰 중간 RGB 값 계산
            let r = Math.round(r1 + (r2 - r1) * ratio);
            let g = Math.round(g1 + (g2 - g1) * ratio);
            let b = Math.round(b1 + (b2 - b1) * ratio);
    
            // RGB를 16진수 색상 코드(#RRGGBB)로 변환
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
        }

        // 그룹별(초/중/고) 커스텀 오버레이 마커 토글 함수
        function toggleSchoolMarkers(groupType, show) {
            // 해당 그룹의 기존 오버레이 제거
            for (var i = 0; i < schoolOverlays[groupType].length; i++) {
                schoolOverlays[groupType][i].setMap(null);
            }
            schoolOverlays[groupType] = [];

            if (!show) return;

            
            var dataList;
            
            var borderColor;
            if (groupType === 'elem') {
                dataList = elemDataList;
                borderColor = '#27ae60'; // 초등학교: 초록색 테두리
            } else if (groupType === 'middle') {
                dataList = middleDataList;
                borderColor = '#e74c3c'; // 중학교: 빨간색 테두리
            } else if (groupType === 'high') {
                dataList = highDataList;
                borderColor = '#2980b9'; // 고등학교: 파란색 테두리
            }

            for (var j = 0; j < dataList.length; j++) {
                var school = dataList[j];
                var position = new naver.maps.LatLng(school.lat, school.lng);

                // 마커 생성
                var marker = new naver.maps.Marker({
                    map: window.mapInstance,
                    position: position,
                    title: school.name
                });
                schoolOverlays[groupType].push(marker);


                // 독립적인 랭킹 네모상자 HTML 생성
                var contentString = [
                    '<div style="padding:6px 10px; background:white; border:2px solid ' + borderColor + '; border-radius:6px; font-size:11px; box-shadow:0 2px 6px rgba(0,0,0,0.3); position:absolute; bottom:15px; transform:translateX(-50%); white-space:nowrap;">',
                    '   <strong>' + school.name + '</strong><br>',
                    '   <span style="color:' + borderColor + '; font-weight:bold;">Rating : '+'</span> '  + '상위 '+  school.rating ,
                //  '   <span style="color:' + borderColor + '; font-weight:bold;">평점: ' + school.rating + '</span> (' + school.rank + ')',
                    '</div>'
                ].join('');

                // CustomOverlay 객체 정의
                var CustomOverlay = function(options) {
                    this._position = options.position;
                    this._content = options.content;
                    this._map = options.map;
                    this._element = document.createElement('div');
                    this._element.style.position = 'absolute';
                    this._element.innerHTML = options.content;
                    this.setMap(options.map);
                };

                CustomOverlay.prototype = new naver.maps.OverlayView();
                CustomOverlay.prototype.constructor = CustomOverlay;

                CustomOverlay.prototype.onAdd = function() {
                    var overlayLayer = this.getPanes().overlayLayer;
                    overlayLayer.appendChild(this._element);
                };

                CustomOverlay.prototype.draw = function() {
                    if (!this.getMap()) return;
                    var projection = this.getProjection();
                    var position = this._position;
                    var pixelPosition = projection.fromCoordToOffset(position);
                    this._element.style.left = pixelPosition.x + 'px';
                    this._element.style.top = pixelPosition.y + 'px';
                };

                CustomOverlay.prototype.onRemove = function() {
                    this._element.parentNode.removeChild(this._element);
                    this._element.innerHTML = "";
                };

                // 각 학교마다 독립된 커스텀 오버레이 생성 및 등록
                var customOverlay = new CustomOverlay({
                    map: window.mapInstance,
                    position: position,
                    content: contentString
                });

                schoolOverlays[groupType].push(customOverlay);
            }
        }

        function updateMap() {
            var activePolylines = window.activePolylines;
            var activeCircles = window.activeCircles;
            var coordsList = window.coordsList;
            var routeColors = window.routeColors;
            var map = window.mapInstance;

            for (var i = 0; i < activePolylines.length; i++) activePolylines[i].setMap(null);
            for (var j = 0; j < activeCircles.length; j++) activeCircles[j].setMap(null);
            window.activePolylines = [];
            window.activeCircles = [];

            var pointCounts = {};

            for (var r = 0; r < coordsList.length; r++) {
                var chk = document.getElementById('chk' + (r + 1));
                if (chk && chk.checked) {
                    var pl = new naver.maps.Polyline({
                        map: map,
                        path: coordsList[r],
                        strokeColor: routeColors[r],
                        strokeWeight: 4
                    });
                    window.activePolylines.push(pl);

                    for (var p = 0; p < coordsList[r].length; p++) {
                        var latKey = coordsList[r][p].lat().toFixed(5);
                        var lngKey = coordsList[r][p].lng().toFixed(5);
                        var key = latKey + "," + lngKey;

                        if (!pointCounts[key]) {
                            pointCounts[key] = {
                                latLng: coordsList[r][p],
                                count: 0
                            };
                        }
                        pointCounts[key].count++;
                    }
                }
            }

            for (var key in pointCounts) {
                var item = pointCounts[key];
                var count = item.count;
                var fillColor, radius, strokeColor;

                if (count === 1) {
                    fillColor = '#ffcccc'; strokeColor = '#ff9999'; radius = 55;
                } else if (count === 2) {
                    fillColor = '#ff7777'; strokeColor = '#ff4444'; radius = 70;
                } else if (count === 3) {
                    fillColor = '#ff2200'; strokeColor = '#cc1100'; radius = 85;
                } else if (count === 4) {
                    fillColor = '#cc0000'; strokeColor = '#990000'; radius = 100;
                } else {
                    fillColor = '#9900ff'; strokeColor = '#6600cc'; radius = 115;
                }

                var circle = new naver.maps.Circle({
                    map: map,
                    center: item.latLng,
                    radius: radius,
                    fillColor: fillColor,
                    fillOpacity: 0.5,
                    strokeColor: strokeColor,
                    strokeWeight: 2,
                    strokeOpacity: 0.8
                });

                window.activeCircles.push(circle);
            }
        }


    middleDataList.forEach(function(item) {
        let boxColor = getColorByRating(item.rating);
    
        let contentString = `
          <div style="
                background-color: ${boxColor};

                border-radius: 4px;

                text-align: center;
            ">
                ${item.name}<br>${item.rating}
            </div>
        `;

    // 네이버 지도 커스텀 오버레이 또는 마커에 contentString 적용
        var customOverlay = new naver.maps.CustomOverlay({
            position: new naver.maps.LatLng(item.lat, item.lng),
            content: contentString,
            map: map
        });
    });
