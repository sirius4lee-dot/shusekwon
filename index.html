<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>송파구 20개 노선 분석 지도</title>
    <!-- [보안 1] API 인증 Key를 HTML 소스 대신 런타임에 동적으로 주입하여 GitHub 소스 노출 방지 -->
    <script type="text/javascript" id="naver-map-script"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            font-family: sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }
        /* [보안 3] 모바일 최적화 사이드바 (접기/펼치기 기능 적용) */
        #sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 320px;
            height: 100%;
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
            z-index: 100;
            box-sizing: border-box;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        /* 사이드바가 닫혔을 때 왼쪽으로 숨김 */
        #sidebar.closed {
            transform: translateX(-100%);
        }
        /* 사이드바 토글 버튼 (열고 닫기) */
        #toggle-btn {
            position: absolute;
            top: 15px;
            left: 335px;
            z-index: 101;
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 14px;
            transition: left 0.3s ease;
        }
        #sidebar.closed ~ #toggle-btn {
            left: 15px;
        }
        #sidebar h3 {
            margin-top: 0;
            font-size: 15px;
        }
        .route-item {
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .route-item input {
            margin-right: 6px;
        }
        /* 우측 하단 범례 박스 디자인 */
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100;
            font-size: 12px;
        }
        #legend h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <!-- [보안 1 조치] 스크립트 로드 보안 처리 로직 -->
    <script>
        (function() {
            var keyId = "y67tjpyj78"; // 본인의 네이버 API KeyID 입력
            var script = document.getElementById('naver-map-script');
            script.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + keyId;
        })();
    </script>

    <!-- [보안 3] 접고 펼칠 수 있는 사이드바 패널 -->
    <div id="sidebar" class="closed">
        <h3>송파구 맞춤 노선 토글</h3>
        <div id="checkbox-container">
            <!-- 직접 작성해주신 20개 노선명 적용 (기본값 해제 상태 유지 위해 checked 제거) -->
            <div class="route-item"><label><input type="checkbox" id="chk1" onchange="updateMap()"> [퇴근(교)] 15:20/23:20 강동하남 (빨간색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk2" onchange="updateMap()"> [퇴근(평/해프전)] 13:30/16:00 잠실/천호 (파랑)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk3" onchange="updateMap()"> [퇴근(금/평)] 16:00/17:00 문정/가락/잠실(초록)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk4" onchange="updateMap()"> [퇴근(금/평)] 16:00/17:00 천호/답십리 (주황색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk5" onchange="updateMap()"> [퇴근(평)] 17:00 고덕동 (보라색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk6" onchange="updateMap()"> [퇴근(평/토)] 17:00/13:00 올림픽/잠실 (청록색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk7" onchange="updateMap()"> [퇴근(평/토)] 17:00/13:00 천호역 (갈색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk8" onchange="updateMap()"> [퇴근(교)] 15:20/23:20 잠실 (핑크색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk9" onchange="updateMap()"> [퇴근(평)] dummy (회색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk10" onchange="updateMap()"> [출근(교)] 05:08/13:04 강동하남선 (검정색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk11" onchange="updateMap()"> [출근(교)] 05:40/13:25 잠실선 (다홍색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk12" onchange="updateMap()"> [출근(토)] 06:50 가락동선 (남색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk13" onchange="updateMap()"> [출근(토)] 06:59 구의/천호 (연두색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk14" onchange="updateMap()"> [출근(토)] 06:55 잠실/천호 (진주황)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk15" onchange="updateMap()"> [출근(평)] 07:45/08:50/11:20 잠실/천호 (자주)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk16" onchange="updateMap()"> [출근(평)] 05:50 잠실/방이 (하늘색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk17" onchange="updateMap()"> [출근(평)] 05:51/07:41 잠실/장지 (황토색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk18" onchange="updateMap()"> [출근(평)] 05:54 강동구/상일 (진분홍)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk19" onchange="updateMap()"> [출근(평)] 06:00 길동/상일 (진회색)</label></div>
            <div class="route-item"><label><input type="checkbox" id="chk20" onchange="updateMap()"> [출근(평)] dummy (진청록)</label></div>
        </div>
    </div>

    <!-- 사이드바 열기/닫기 버튼 -->
    <button id="toggle-btn" onclick="toggleSidebar()">☰ 메뉴</button>

    <!-- 지도가 그려질 영역 -->
    <div id="map"></div>

    <!-- 우측 하단 범례 UI -->
    <div id="legend">
        <h4>중첩 횟수별 범례</h4>
        <div class="legend-item"><div class="legend-color" style="background: #ffcccc;"></div> 1개 중첩 (연한 분홍)</div>
        <div class="legend-item"><div class="legend-color" style="background: #ff7777;"></div> 2개 중첩 (조금 붉은색)</div>
        <div class="legend-item"><div class="legend-color" style="background: #ff2200;"></div> 3개 중첩 (더 붉은색)</div>
        <div class="legend-item"><div class="legend-color" style="background: #cc0000;"></div> 4개 중첩 (아주 빨간색)</div>
        <div class="legend-item"><div class="legend-color" style="background: #9900ff;"></div> 5개 이상 (보라색 형광)</div>
    </div>

    <script>
        // DOM이 모두 로드된 후 실행
        window.onload = function() {
            var map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(37.5133, 127.1001),
                zoom: 13
            });

            // 20개 노선 데이터 좌표 정의
            var coordsList = [
            /* 1 빨간색 */ [new naver.maps.LatLng(37.559475, 127.195110), new naver.maps.LatLng(37.559371, 127.183549), new naver.maps.LatLng(37.556581, 127.164010),new naver.maps.LatLng(37.554829, 127.146540),new naver.maps.LatLng(37.530642, 127.137179)],
            /* 2 파란색 */ [new naver.maps.LatLng(37.546593, 127.172080), new naver.maps.LatLng(37.534396, 127.137067), new naver.maps.LatLng(37.537721, 127.126711), new naver.maps.LatLng(37.513098, 127.098727)], // 37.513, 127.100 중첩
            /* 3 초록색 */ [new naver.maps.LatLng(37.494660, 127.116846), new naver.maps.LatLng(37.500264, 127.111704), new naver.maps.LatLng(37.503347, 127.108922), new naver.maps.LatLng(37.513098, 127.098727)], // 37.513, 127.100 중첩
            /* 4 주황색 */ [new naver.maps.LatLng(37.546593, 127.172080), new naver.maps.LatLng(37.534396, 127.137067), new naver.maps.LatLng(37.537721, 127.126711), new naver.maps.LatLng(37.545347, 127.103571)],
            /* 5 보라색 */ [new naver.maps.LatLng(37.556581, 127.164010), new naver.maps.LatLng(37.555348, 127.155882), new naver.maps.LatLng(37.554829, 127.146540), new naver.maps.LatLng(37.554817, 127.131338), new naver.maps.LatLng(37.550929, 127.127762)], // 37.513, 127.100 중첩
            /* 6 청록색 */ [new naver.maps.LatLng(37.519021, 127.139974), new naver.maps.LatLng(37.516440, 127.130844), new naver.maps.LatLng(37.514247, 127.102726), new naver.maps.LatLng(37.511990, 127.091110), new naver.maps.LatLng(37.511879, 127.084841)],
            /* 7 갈색   */ [new naver.maps.LatLng(37.546593, 127.172080), new naver.maps.LatLng(37.534396, 127.137067), new naver.maps.LatLng(37.537721, 127.126711)],
            /* 8 핑크색 */ [new naver.maps.LatLng(37.514247, 127.102726), new naver.maps.LatLng(37.513098, 127.098727)],
            /* 9 회색   */ [new naver.maps.LatLng(137.556581, 127.164010) ],
            /* 10 검정색*/ [new naver.maps.LatLng(37.529844, 127.137021), new naver.maps.LatLng(37.554636, 127.146326), new naver.maps.LatLng(37.556450, 127.164675)],
            /* 11 다홍색*/ [new naver.maps.LatLng(37.511845, 127.094318), new naver.maps.LatLng(37.509964, 127.099178)], // 37.513, 127.100 중첩 (5개 이상 달성 지점)
            /* 12 남색  */ [new naver.maps.LatLng(37.492788, 127.119691), new naver.maps.LatLng(37.501074, 127.127360), new naver.maps.LatLng(37.524571, 127.135254), new naver.maps.LatLng(37.533650, 127.141079), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 13 연두색*/ [new naver.maps.LatLng(37.538184, 127.124704), new naver.maps.LatLng(37.533650, 127.141079), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 14 진주황*/ [new naver.maps.LatLng(37.511845, 127.094318), new naver.maps.LatLng(37.538184, 127.124704), new naver.maps.LatLng(37.533650, 127.141079), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 15 자주색*/ [new naver.maps.LatLng(37.511845, 127.094318), new naver.maps.LatLng(37.538184, 127.124704), new naver.maps.LatLng(37.533650, 127.141079), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 16 하늘색*/ [new naver.maps.LatLng(37.518917, 127.105830), new naver.maps.LatLng(37.504798, 127.107233), new naver.maps.LatLng(37.499806, 127.111870), new naver.maps.LatLng(37.501242, 127.129245), new naver.maps.LatLng(37.499512, 127.135514)],
            /* 17 황토색*/ [new naver.maps.LatLng(37.511473, 127.084458), new naver.maps.LatLng(37.511845, 127.094318), new naver.maps.LatLng(37.504798, 127.107233), new naver.maps.LatLng(37.492202, 127.118812), new naver.maps.LatLng(37.480128, 127.125270)],
            /* 18 진분홍*/ [new naver.maps.LatLng(37.531803, 127.121059), new naver.maps.LatLng(37.540035, 127.123935), new naver.maps.LatLng(37.550972, 127.127891), new naver.maps.LatLng(37.554636, 127.145690), new naver.maps.LatLng(37.555087, 127.155005), new naver.maps.LatLng(37.556430, 127.164720), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 19 진회색*/ [new naver.maps.LatLng(37.534509, 127.136219), new naver.maps.LatLng(37.546347, 127.172536)],
            /* 20 진청록*/ [new naver.maps.LatLng(137.510, 127.125)]
            ];

            // 20개 노선 선 색상 정의
            var routeColors = [
                '#ff0000', '#0000ff', '#008000', '#ffa500', '#800080', 
                '#008080', '#a52a2a', '#ffc0cb', '#808080', '#000000', 
                '#ff4500', '#000080', '#9acd32', '#ff8c00', '#8b008b', 
                '#00bfff', '#d2b48c', '#ff1493', '#2f4f4f', '#008b8b'
            ];

            window.activePolylines = [];
            window.activeCircles = [];
            window.coordsList = coordsList;
            window.routeColors = routeColors;
            window.mapInstance = map;

            // 초기 실행 (체크된 항목이 없으므로 지도가 빈 상태로 시작)
            updateMap();
        };

        // 사이드바 열고 닫는 토글 함수
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
        }

        // 지도 렌더링 업데이트 함수
        function updateMap() {
            var activePolylines = window.activePolylines;
            var activeCircles = window.activeCircles;
            var coordsList = window.coordsList;
            var routeColors = window.routeColors;
            var map = window.mapInstance;

            for (var i = 0; i < activePolylines.length; i++) activePolylines[i].setMap(null);
            for (var j = 0; j < activeCircles.length; j++) activeCircles[j].setMap(null);
            window.activePolylines = [];
            window.activeCircles = [];

            var pointCounts = {};

            for (var r = 0; r < coordsList.length; r++) {
                var chk = document.getElementById('chk' + (r + 1));
                if (chk && chk.checked) {
                    var pl = new naver.maps.Polyline({
                        map: map,
                        path: coordsList[r],
                        strokeColor: routeColors[r],
                        strokeWeight: 4
                    });
                    window.activePolylines.push(pl);

                    for (var p = 0; p < coordsList[r].length; p++) {
                        var latKey = coordsList[r][p].lat().toFixed(5);
                        var lngKey = coordsList[r][p].lng().toFixed(5);
                        var key = latKey + "," + lngKey;

                        if (!pointCounts[key]) {
                            pointCounts[key] = {
                                latLng: coordsList[r][p],
                                count: 0
                            };
                        }
                        pointCounts[key].count++;
                    }
                }
            }

            for (var key in pointCounts) {
                var item = pointCounts[key];
                var count = item.count;
                var fillColor, radius, strokeColor;

                if (count === 1) {
                    fillColor = '#ffcccc'; strokeColor = '#ff9999'; radius = 55;
                } else if (count === 2) {
                    fillColor = '#ff7777'; strokeColor = '#ff4444'; radius = 70;
                } else if (count === 3) {
                    fillColor = '#ff2200'; strokeColor = '#cc1100'; radius = 85;
                } else if (count === 4) {
                    fillColor = '#cc0000'; strokeColor = '#990000'; radius = 100;
                } else {
                    fillColor = '#9900ff'; strokeColor = '#6600cc'; radius = 115;
                }

                var circle = new naver.maps.Circle({
                    map: map,
                    center: item.latLng,
                    radius: radius,
                    fillColor: fillColor,
                    fillOpacity: 0.5,
                    strokeColor: strokeColor,
                    strokeWeight: 2,
                    strokeOpacity: 0.8
                });

                window.activeCircles.push(circle);
            }
        }
    </script>
</body>
</html>
